name: Basic checks
on:
  push:
  pull_request:
jobs:
  python-and-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Bash syntax
        run: bash -n Bash/linux-healthcheck.sh
